name: CI
on:
  push:
  pull_request:
permissions:
  contents: write
jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y python3-tk
      - run: python -m pip install -r see/scripts/requirements-credentials.txt
      - run: python -m unittest discover -s tests -v

  package:
    needs: python-tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            installer: appimage
          - os: windows-latest
            installer: nsis
          - os: macos-14
            installer: dmg
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Python and Tkinter (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk python3-venv
          python3 -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Prepare Python and Tkinter (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install python@3.12 python-tk@3.12
          "$(brew --prefix python@3.12)/bin/python3.12" -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        with:
          python-version: '3.12'

      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        run: choco install nsis -y --no-progress

      - name: Install Python build dependencies
        run: |
          python -m pip install -r see/scripts/requirements-credentials.txt -r packaging/requirements-build.txt

      - name: Compile source
        run: |
          python -m py_compile see/scripts/gui.py see/scripts/onboard.py see/scripts/parse_media.py see/scripts/usage_log.py see/scripts/secure_credentials.py packaging/gui_entry.py packaging/build_installers.py

      - name: Build installer
        run: |
          python packaging/build_installers.py --installer ${{ matrix.installer }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: SeeGui-${{ matrix.installer }}
          path: dist/installers/SeeGui.*
          if-no-files-found: error

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ github.ref_name }}"
          DISPLAY_NAME="${VERSION#v}"
          gh release delete "$VERSION" --repo "${{ github.repository }}" --yes || true
          gh release create "$VERSION" \
            release-artifacts/* \
            --repo "${{ github.repository }}" \
            --title "SeeGui ${DISPLAY_NAME}" \
            --generate-notes
