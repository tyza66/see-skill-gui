name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y python3-tk
      - run: python -m pip install -r see/scripts/requirements-credentials.txt
      - run: python -m unittest discover -s tests -v

  package:
    needs: python-tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            installer: appimage
          - os: windows-latest
            installer: nsis
          - os: macos-13
            installer: dmg
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Python and Tkinter (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk python3-venv
          python3 -m venv .venv
          echo "PYTHON=$PWD/.venv/bin/python" >> "$GITHUB_ENV"

      - name: Prepare Python and Tkinter (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install python@3.12 python-tk@3.12
          echo "PYTHON=$(brew --prefix python@3.12)/bin/python3.12" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        with:
          python-version: '3.12'

      - name: Set Windows Python command
        if: runner.os == 'Windows'
        run: echo "PYTHON=python" >> "$GITHUB_ENV"

      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        run: choco install nsis -y --no-progress

      - name: Install Python build dependencies
        run: $PYTHON -m pip install -r see/scripts/requirements-credentials.txt -r packaging/requirements-build.txt

      - name: Compile source
        run: $PYTHON -m py_compile see/scripts/gui.py packaging/gui_entry.py packaging/build_installers.py

      - name: Build installer
        run: $PYTHON packaging/build_installers.py --installer ${{ matrix.installer }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: SeeGui-${{ matrix.installer }}
          path: dist/*
          if-no-files-found: error
