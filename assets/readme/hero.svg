<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="390" viewBox="0 0 1200 390"
     role="img" aria-labelledby="title desc">
  <title id="title">see — 为纯文本模型补充原生图片与视频理解</title>
  <desc id="desc">图片和视频经过 see 在 LongCat、DeepSeek、Gemini、Qwen 等可用视觉路径间自动路由，并兜底到本机 OCR。</desc>

  <rect width="1200" height="390" rx="28" fill="#06100E"/>
  <path d="M0 306H1200" stroke="#17332B" stroke-width="2"/>

  <g id="title-block" transform="translate(62 55)"
     font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">
    <text x="0" y="22" fill="#5EE7B1" font-size="20" font-weight="700" letter-spacing="2">MULTIMODAL BRIDGE</text>
    <text x="0" y="104" fill="#F4FBF7" font-size="82" font-weight="760">see</text>
    <text x="0" y="154" fill="#D8E7E1" font-size="28" font-weight="600">让纯文本模型，原生看图、看视频</text>
    <text x="0" y="198" fill="#8DA69B" font-size="21">图片原图直传 · 视频智能压缩 · 多供应商自动路由</text>
  </g>

  <g id="routing-proof" transform="translate(640 44)"
     font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">
    <rect x="0" y="0" width="492" height="235" rx="22" fill="#0B1B17" stroke="#21473B" stroke-width="2"/>

    <g id="text-model" transform="translate(20 28)">
      <rect width="126" height="58" rx="14" fill="#102722"/>
      <text x="63" y="25" text-anchor="middle" fill="#8DA69B" font-size="18" font-weight="650">NO VISION</text>
      <text x="63" y="47" text-anchor="middle" fill="#F4FBF7" font-size="20" font-weight="750">ANY MODEL</text>
    </g>

    <path d="M146 57H186" stroke="#5EE7B1" stroke-width="3"/>
    <path d="M179 50L188 57L179 64" fill="none" stroke="#5EE7B1" stroke-width="3"/>

    <g id="see-router" transform="translate(191 23)">
      <circle cx="42" cy="34" r="34" fill="#5EE7B1"/>
      <path d="M22 34C32 19 52 19 62 34C52 49 32 49 22 34Z" fill="none" stroke="#06100E" stroke-width="4"/>
      <circle cx="42" cy="34" r="7" fill="#06100E"/>
      <text x="42" y="91" text-anchor="middle" fill="#D8E7E1" font-size="20" font-weight="750">see</text>
    </g>

    <path d="M268 57H301V32H318" fill="none" stroke="#7AA7FF" stroke-width="3"/>
    <path d="M268 57H301V82H318" fill="none" stroke="#5EE7B1" stroke-width="3"/>
    <path d="M268 57H301V132H318" fill="none" stroke="#FF9E64" stroke-width="3"/>
    <path d="M268 57H301V182H318" fill="none" stroke="#B67AE8" stroke-width="3"/>

    <g id="gemini-output" transform="translate(318 9)">
      <rect width="96" height="50" rx="12" fill="#132642" stroke="#355D9E" stroke-width="2"/>
      <text x="48" y="22" text-anchor="middle" fill="#AFC8FF" font-size="16" font-weight="700">GEMINI</text>
      <text x="48" y="41" text-anchor="middle" fill="#F4FBF7" font-size="16" font-weight="750">VIDEO</text>
    </g>

    <g id="qwen-output" transform="translate(318 59)">
      <rect width="96" height="50" rx="12" fill="#123126" stroke="#2B6A51" stroke-width="2"/>
      <text x="48" y="22" text-anchor="middle" fill="#94E8C4" font-size="16" font-weight="700">QWEN</text>
      <text x="48" y="41" text-anchor="middle" fill="#F4FBF7" font-size="16" font-weight="750">VISION</text>
    </g>

    <g id="longcat-output" transform="translate(318 109)">
      <rect width="96" height="50" rx="12" fill="#3A2A12" stroke="#B5862B" stroke-width="2"/>
      <text x="48" y="22" text-anchor="middle" fill="#FFD88A" font-size="15" font-weight="700">LONGCAT</text>
      <text x="48" y="41" text-anchor="middle" fill="#F4FBF7" font-size="15" font-weight="750">NO KEY</text>
    </g>

    <g id="deepseek-output" transform="translate(318 159)">
      <rect width="96" height="50" rx="12" fill="#1A1230" stroke="#7E5BD6" stroke-width="2"/>
      <text x="48" y="22" text-anchor="middle" fill="#C9B3FF" font-size="15" font-weight="700">DEEPSEEK</text>
    </g>

    <text x="20" y="220" fill="#8DA69B" font-size="17">同一个入口，自动选择可用的视觉路径，并兜底到本机 OCR</text>
  </g>

  <g id="metadata" transform="translate(62 337)"
     font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
     font-size="17" font-weight="650">
    <text x="0" y="0" fill="#5EE7B1">GEMINI 3.1 FLASH-LITE · QWEN3.7 PLUS</text>
    <text x="380" y="0" fill="#C9B3FF">DEEPSEEK · LONGCAT</text>
    <text x="720" y="0" fill="#8DA69B">ZENMUX · 百炼 · OPENROUTER · TOKENDANCE</text>
  </g>
</svg>
